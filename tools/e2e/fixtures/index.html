<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Harness fixture</title><style>body{font:18px sans-serif;max-width:800px;margin:auto} button{padding:1rem;margin:.5rem} #mat{display:flex;gap:3rem;padding:2rem;background:#ddd} .zone{padding:2rem;border:2px solid #777}</style></head>
<body><h1>Harness fixture — not the product</h1><p id="status">Connecting</p><p id="caption"></p><p id="transcript"></p><button id="begin">Begin session</button><button id="menu">Menu</button><div id="mat"><button id="card" draggable="true">Apple</button><div id="left" class="zone">Left</div><div id="right" class="zone">Right</div></div><script>
const ws=new WebSocket(window.__MOCK_WS_URL); ws.binaryType='arraybuffer';
const send=(type,fields={})=>ws.send(JSON.stringify({type,v:1,...fields}));
let audio, pending, stream, recorder, samples=[];
ws.onopen=()=>send('hello',{learner_id:'fixture',client:'webxr'});
ws.onmessage=async e=>{ if(typeof e.data!=='string'){if(!pending)return; const bytes=new Int16Array(e.data); const buffer=audio.createBuffer(1,bytes.length,24000); const output=buffer.getChannelData(0); for(let i=0;i<bytes.length;i++)output[i]=bytes[i]/32768; const source=audio.createBufferSource(); source.buffer=buffer; source.connect(audio.destination); source.start(); document.querySelector('#caption').textContent=pending.text; pending=null; return; } const m=JSON.parse(e.data); if(m.type==='welcome')document.querySelector('#status').textContent='Ready'; if(m.type==='speak_chunk')pending=m; if(m.type==='transcript')document.querySelector('#transcript').textContent='You: '+m.text; };
document.querySelector('#begin').onclick=async()=>{audio=new AudioContext();await audio.resume();send('player_event',{kind:'area_placed'});send('player_event',{kind:'session_start'});};
document.querySelector('#menu').onclick=()=>document.querySelector('#status').textContent='Menu open';
document.querySelector('#card').onclick=()=>send('player_select',{instance_id:'apple'});
document.querySelector('#card').ondragstart=e=>e.dataTransfer.setData('text/plain','apple');
for(const zone of document.querySelectorAll('.zone')) {zone.ondragover=e=>e.preventDefault();zone.ondrop=e=>{e.preventDefault();send('player_move',{instance_id:'apple',region:zone.id,container_id:null});};}
let held=false, start=0;
document.onkeydown=async e=>{if(e.repeat)return;if(e.code==='Space'){e.preventDefault();held=true;start=performance.now();send('talk_start');stream=await navigator.mediaDevices.getUserMedia({audio:true});if(!held){stream.getTracks().forEach(t=>t.stop());return;} const ctx=new AudioContext({sampleRate:16000}); const input=ctx.createMediaStreamSource(stream);recorder=ctx.createScriptProcessor(1024,1,1); samples=[];recorder.onaudioprocess=e=>samples.push(new Float32Array(e.inputBuffer.getChannelData(0)));input.connect(recorder);recorder.connect(ctx.destination);recorder.ctx=ctx;} if(e.code==='KeyR')send('repeat');if(e.code==='KeyH')send('player_event',{kind:'help_hint'});if(e.code==='KeyM')document.querySelector('#menu').click();if(e.code==='KeyL')send('set_preference',{patch:{pace:'slow'}});};
document.onkeyup=e=>{if(e.code!=='Space')return;held=false;if(!recorder)return;recorder.disconnect();recorder.ctx.close();stream.getTracks().forEach(t=>t.stop());let n=samples.reduce((a,b)=>a+b.length,0), pcm=new Int16Array(n),i=0;for(const chunk of samples)for(const x of chunk)pcm[i++]=Math.max(-32768,Math.min(32767,Math.round(x*32767)));send('audio_begin',{kind:'utterance',format:'pcm_s16le',sample_rate:16000,channels:1});ws.send(pcm.buffer);send('talk_end',{hold_ms:Math.round(performance.now()-start)});recorder=null;};
</script></body></html>
