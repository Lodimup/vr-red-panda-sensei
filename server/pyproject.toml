[project]
name = "sensei-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic-ai-slim[openai]>=2,<3",
    "sherpa-onnx>=1.13.8,<3",
    "numpy>=2,<3",
    "qwen-tts==0.1.1",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
